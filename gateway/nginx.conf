# API gateway: single entry point that routes to each microservice by URL prefix.
# Docker's embedded DNS (127.0.0.11) lets nginx start even if a service is stopped,
# and re-resolves names so a redeployed container is picked up without restarting nginx.
events {}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location /users    { set $up http://user-service:5001;    proxy_pass $up; }
        location /products { set $up http://product-service:5002; proxy_pass $up; }
        location /orders   { set $up http://order-service:5003;   proxy_pass $up; }
        location /payments { set $up http://payment-service:5004; proxy_pass $up; }

        location / {
            default_type application/json;
            return 200 '{"gateway":"ok","routes":["/users","/products","/orders","/payments"]}';
        }
    }
}
