name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/shop

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 .

  test:
    name: Build images and run integration tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest requests

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the gateway
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/users >/dev/null && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run integration tests
        run: pytest -v

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Push images to GitHub Container Registry
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push each service (tagged with commit SHA and latest)
        run: |
          for svc in user product order payment; do
            docker build -t $IMAGE_PREFIX-$svc-service:${{ github.sha }} \
                         -t $IMAGE_PREFIX-$svc-service:latest ./$svc-service
            docker push --all-tags $IMAGE_PREFIX-$svc-service
          done
